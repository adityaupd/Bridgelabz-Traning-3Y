<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Security Form Attributes</title></head><body><h1>Account request</h1><form action="#" autocomplete="off"><p><label>Name <input name="name" required></label></p><p><label>Email <input name="email" type="email" required></label></p><button type="submit">Continue</button></form><p>Disabling autocomplete can reduce saved-field suggestions on shared devices, but it does not replace secure transport, careful storage, or server-side protections.</p></body></html>
