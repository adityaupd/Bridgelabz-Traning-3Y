<!doctype html>
<html lang="en">
<head>
  <!-- charset declares text encoding; description and author provide document metadata. -->
  <meta charset="UTF-8">
  <meta name="description" content="A page demonstrating common HTML head elements.">
  <meta name="author" content="Aditya Upadhyay">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The title appears in the browser tab and search results. -->
  <title>HTML Head Elements</title>
  <!-- base sets the root URL used by relative links. -->
  <base href="https://example.com/resources/">
  <!-- link connects an external resource such as a favicon. -->
  <link rel="icon" href="data:," type="image/x-icon">
  <!-- style holds internal CSS rules; script can hold or load JavaScript. -->
  <style>/* Internal styles can be added here. */</style>
  <script>/* Page scripts can be added here. */</script>
</head>
<body><h1>Head elements</h1><p>The title, metadata, base URL, favicon link, style, and script belong in the document head.</p><a href="guide.html">Guide link resolved against the base URL</a></body>
</html>
