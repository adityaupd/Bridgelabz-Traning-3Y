<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSS Animations</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#172033;background:#f1f5f9}header,main,footer{max-width:1050px;margin:1rem auto}header,footer{padding:1rem;background:#0f172a;color:#fff}main{padding:1rem}h1{margin-top:0}section,article,.box,figure{padding:1rem;background:#fff;border-radius:.75rem}a{color:#075985}button,input,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:.4rem}button{cursor:pointer;background:#e0f2fe}img{max-width:100%;border-radius:.6rem}nav{display:flex;gap:1rem;flex-wrap:wrap}ul{padding-left:1.3rem}.motion{min-height:45vh;display:flex;align-items:center;justify-content:space-around;gap:2rem;flex-wrap:wrap}.move{width:4rem;height:4rem;background:#38bdf8;animation:move 2s ease-in-out infinite alternate}.ball{width:3rem;height:3rem;border-radius:50%;background:#a78bfa;animation:bounce .8s ease-in-out .2s infinite alternate}.color{font-size:1.4rem;animation:color 3s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(3rem) rotate(20deg)}}@keyframes bounce{to{transform:translateY(-2rem)}}@keyframes color{to{color:#e11d48}}
</style>
</head><body><header><p>Css Ui Effects</p></header><h1>Motion Study</h1><main class="motion"><div class="move">Move</div><div class="ball">Bounce</div><p class="color">Color shift</p></main><footer>© 2026 Aditya Upadhyay</footer></body></html>
