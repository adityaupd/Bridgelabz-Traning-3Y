<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gradient Backgrounds</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#fff;background:#0f172a}.gradient-page>header,.gradient-page>footer{position:fixed;left:0;right:0;z-index:2;text-align:center;padding:1rem;background:#0f172a;color:white}.gradient-page>header{top:0}.gradient-page>footer{bottom:0}.gradient-page>main{max-width:1050px;margin:1rem auto;padding-top:5rem;padding-bottom:5rem}.linear,.radial{min-height:45vh;padding:3rem;margin:1rem 0;border-radius:1rem}.linear{background:linear-gradient(120deg,#0ea5e9,#8b5cf6);background-attachment:fixed}.radial{background:radial-gradient(circle at top,#fbbf24,#be123c)}
</style>
</head><body class="gradient-page"><header>Gradient Studio</header><main><section class="linear"><h1>Linear gradient</h1><p>Color flows across the section.</p></section><section class="radial"><h2>Radial gradient</h2><p>Color expands from a center point.</p></section></main><footer>Scroll to explore</footer></body></html>
