<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSS Tooltips</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#172033;background:#f1f5f9}header,main,footer{max-width:1050px;margin:1rem auto}header,footer{padding:1rem;background:#0f172a;color:#fff}main{padding:1rem}h1{margin-top:0}section,article,.box,figure{padding:1rem;background:#fff;border-radius:.75rem}a{color:#075985}button,input,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:.4rem}button{cursor:pointer;background:#e0f2fe}img{max-width:100%;border-radius:.6rem}nav{display:flex;gap:1rem;flex-wrap:wrap}ul{padding-left:1.3rem}.tips{min-height:45vh;display:flex;justify-content:center;align-items:center;gap:4rem}.tip{position:relative;padding:.8rem 1rem;background:#dbeafe;border-radius:.5rem;cursor:help}.tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + .6rem);left:50%;transform:translate(-50%,.3rem);opacity:0;transition:.3s ease-in-out;background:#0f172a;color:white;padding:.5rem .7rem;border-radius:.4rem;white-space:nowrap}.tip:hover::after,.tip:focus::after{opacity:1;transform:translate(-50%,0)}
</style>
</head><body><header><p>Css Ui Effects</p></header><h1>Helpful Labels</h1><main class="tips"><span class="tip" data-tip="Explore our latest stories">Stories</span><span class="tip" data-tip="Meet the people behind the work">Team</span><span class="tip" data-tip="Send us a note anytime">Contact</span></main><footer>© 2026 Aditya Upadhyay</footer></body></html>
