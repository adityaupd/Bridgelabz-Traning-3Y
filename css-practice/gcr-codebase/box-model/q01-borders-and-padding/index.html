<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Borders and Padding</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#172033;background:#f1f5f9}header,main,footer{max-width:1050px;margin:1rem auto}header,footer{padding:1rem;background:#0f172a;color:#fff}main{padding:1rem}h1{margin-top:0}section,article,.box,figure{padding:1rem;background:#fff;border-radius:.75rem}a{color:#075985}button,input,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:.4rem}button{cursor:pointer;background:#e0f2fe}img{max-width:100%;border-radius:.6rem}nav{display:flex;gap:1rem;flex-wrap:wrap}ul{padding-left:1.3rem}.row{display:flex;gap:1rem;flex-wrap:wrap}.row div{background:#e0f2fe;border-radius:1rem;padding:1.5rem;transition:border-color .25s}.solid{border:4px solid #2563eb}.dashed{border:4px dashed #7c3aed;padding:.8rem}.double{border:6px double #059669;padding:2rem}.groove{border:6px groove #f97316;border-radius:2rem}.row div:hover{border-color:#dc2626}
</style>
</head><body><header><p>Css Box Model Practice</p></header><h1>Borders and Padding</h1><main><section class="row"><div class="solid">Solid border<br>Comfortable padding</div><div class="dashed">Dashed border<br>Compact padding</div><div class="double">Double border<br>Wide padding</div><div class="groove">Groove border<br>Rounded corners</div></section></main><footer>© 2026 Aditya Upadhyay</footer></body></html>
