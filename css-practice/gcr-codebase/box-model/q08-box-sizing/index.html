<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Box Sizing</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#172033;background:#f1f5f9}header,main,footer{max-width:1050px;margin:1rem auto}header,footer{padding:1rem;background:#0f172a;color:#fff}main{padding:1rem}h1{margin-top:0}section,article,.box,figure{padding:1rem;background:#fff;border-radius:.75rem}a{color:#075985}button,input,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:.4rem}button{cursor:pointer;background:#e0f2fe}img{max-width:100%;border-radius:.6rem}nav{display:flex;gap:1rem;flex-wrap:wrap}ul{padding-left:1.3rem}.compare{display:flex;gap:2rem;flex-wrap:wrap;justify-content:center}.compare section{flex:1;min-width:240px}.content,.border{width:240px;max-width:100%;padding:1.5rem;background:#bfdbfe;border:6px solid #2563eb}.content{box-sizing:content-box}.border{box-sizing:border-box;background:#bbf7d0;border-color:#16a34a}
</style>
</head><body><header><p>Css Ui Effects</p></header><h1>Box Sizing Comparison</h1><main class="compare"><section><h2>Content-box</h2><div class="content">Width 240px + padding</div><p>Padding increases total rendered width.</p></section><section><h2>Border-box</h2><div class="border">Width includes padding</div><p>Rendered width remains 240px.</p></section></main><footer>© 2026 Aditya Upadhyay</footer></body></html>
