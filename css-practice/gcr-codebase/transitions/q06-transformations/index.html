<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Transformations</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#172033;background:#f1f5f9}header,main,footer{max-width:1050px;margin:1rem auto}header,footer{padding:1rem;background:#0f172a;color:#fff}main{padding:1rem}h1{margin-top:0}section,article,.box,figure{padding:1rem;background:#fff;border-radius:.75rem}a{color:#075985}button,input,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:.4rem}button{cursor:pointer;background:#e0f2fe}img{max-width:100%;border-radius:.6rem}nav{display:flex;gap:1rem;flex-wrap:wrap}ul{padding-left:1.3rem}.transforms{display:flex;gap:1rem;flex-wrap:wrap}.transforms figure{margin:0;text-align:center}.transforms figure div{padding:1rem;background:#bfdbfe;transition:all .4s ease}.rotate:hover{transform:rotate(8deg)}.scale:hover{transform:scale(1.12)}.translate:hover{transform:translateY(-10px)}.skew:hover{transform:skew(-8deg)}
</style>
</head><body><header><p>Css Box Model Practice</p></header><h1>Transformations</h1><main class="transforms"><figure><div class="rotate">Rotate</div><figcaption>rotate()</figcaption></figure><figure><div class="scale">Scale</div><figcaption>scale()</figcaption></figure><figure><div class="translate">Translate</div><figcaption>translate()</figcaption></figure><figure><div class="skew">Skew</div><figcaption>skew()</figcaption></figure></main><footer>© 2026 Aditya Upadhyay</footer></body></html>
