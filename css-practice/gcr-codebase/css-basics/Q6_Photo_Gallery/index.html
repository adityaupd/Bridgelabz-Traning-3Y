<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Photo Gallery</title>
    
<style>
/* Q6: CSS-only photo gallery */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f8fafc;
    color: #1e293b;
}

.gallery-page {
    width: 92%;
    max-width: 80rem;
    margin: auto;
    padding: 4rem 0;
}

.gallery-page > header {
    text-align: center;
    margin-bottom: 2.5rem;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
}

.gallery-item {
    position: relative;
    margin: 0;
    overflow: hidden;
    border-radius: 0.8rem;
    box-shadow: 0 0.5rem 1.2rem rgba(15, 23, 42, 0.18);
}

.gallery-item img {
    display: block;
    width: 100%;
    height: 18rem;
    object-fit: cover;
    transition: transform 0.35s ease;
}

.gallery-item figcaption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 1rem;
    background-color: rgba(0, 0, 0, 0.7);
    color: #ffffff;
    opacity: 0;
    transition: opacity 0.35s ease;
}

.gallery-item:hover img {
    transform: scale(1.1);
}

.gallery-item:hover figcaption {
    opacity: 1;
}

@media (max-width: 800px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {
    .gallery {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
    <main class="gallery-page">
        <header>
            <h1>Travel Gallery</h1>
            <p>A CSS-only responsive image gallery.</p>
        </header>

        <section class="gallery" aria-label="Travel photographs">
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape">
                <figcaption>Mountain Escape</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Beach and ocean">
                <figcaption>Ocean View</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Forest path">
                <figcaption>Forest Trail</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80" alt="Green valley">
                <figcaption>Green Valley</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Lake and mountains">
                <figcaption>Peaceful Lake</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=900&q=80" alt="Snow covered mountain">
                <figcaption>Snowy Peak</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
