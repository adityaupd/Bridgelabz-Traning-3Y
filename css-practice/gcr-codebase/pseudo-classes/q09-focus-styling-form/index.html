<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Focus Styling Form</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#172033;background:#f1f5f9}header,main,footer{max-width:1050px;margin:1rem auto}header,footer{padding:1rem;background:#0f172a;color:#fff}main{padding:1rem}h1{margin-top:0}section,article,.box,figure{padding:1rem;background:#fff;border-radius:.75rem}a{color:#075985}button,input,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:.4rem}button{cursor:pointer;background:#e0f2fe}img{max-width:100%;border-radius:.6rem}nav{display:flex;gap:1rem;flex-wrap:wrap}ul{padding-left:1.3rem}form{max-width:32rem;margin:auto;padding:1.5rem;background:#fff;border-radius:1rem;box-shadow:0 4px 16px #0f172a1a}label input,label textarea{width:100%;margin-top:.4rem;border-radius:.5rem}input:focus,textarea:focus{outline:3px solid #0ea5e9;outline-offset:3px}button:focus{outline:3px dashed #7c3aed;outline-offset:4px}
</style>
</head><body><header><p>Css Box Model Practice</p></header><h1>Focus and Outline</h1><main><form><p><label>Name<br><input type="text" placeholder="Your name"></label></p><p><label>Message<br><textarea rows="4" placeholder="Write a message"></textarea></label></p><button>Send</button></form></main><footer>© 2026 Aditya Upadhyay</footer></body></html>
