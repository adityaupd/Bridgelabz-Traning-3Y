<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button Collection</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#172033;background:#f1f5f9}header,main,footer{max-width:1050px;margin:1rem auto}header,footer{padding:1rem;background:#0f172a;color:#fff}main{padding:1rem}h1{margin-top:0}section,article,.box,figure{padding:1rem;background:#fff;border-radius:.75rem}a{color:#075985}button,input,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:.4rem}button{cursor:pointer;background:#e0f2fe}img{max-width:100%;border-radius:.6rem}nav{display:flex;gap:1rem;flex-wrap:wrap}ul{padding-left:1.3rem}.buttons{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;justify-content:center}.buttons button{padding:.8rem 1.2rem;border:0;border-radius:.6rem;box-shadow:0 3px 8px #0f172a1a;transition:transform .2s,background .2s}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0}.outline{background:transparent;border:2px solid #2563eb!important;color:#1d4ed8}.buttons button:hover:not(:disabled){transform:translateY(-3px)}.buttons button:active{transform:scale(.96)}.buttons button:focus{outline:3px solid #38bdf8}.buttons button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head><body><header><p>Css Ui Effects</p></header><h1>Button Styles</h1><main class="buttons"><button class="primary">Primary</button><button class="secondary">Secondary</button><button class="outline">Outline</button><button disabled>Disabled</button></main><footer>© 2026 Aditya Upadhyay</footer></body></html>
