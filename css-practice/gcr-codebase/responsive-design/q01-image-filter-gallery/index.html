<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Image Filter Gallery</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#172033;background:#f1f5f9}header,main,footer{max-width:1050px;margin:1rem auto}header,footer{padding:1rem;background:#0f172a;color:#fff}main{padding:1rem}h1{margin-top:0}section,article,.box,figure{padding:1rem;background:#fff;border-radius:.75rem}a{color:#075985}button,input,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:.4rem}button{cursor:pointer;background:#e0f2fe}img{max-width:100%;border-radius:.6rem}nav{display:flex;gap:1rem;flex-wrap:wrap}ul{padding-left:1.3rem}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}.gallery figure{margin:0;background:white;padding:.5rem}.gallery img{width:100%;height:180px;object-fit:cover;transition:filter .4s}.filter1{filter:blur(2px)}.filter2{filter:grayscale(1)}.filter3{filter:sepia(.8)}.filter4{filter:brightness(1.35)}.filter5{filter:contrast(1.5)}.filter6{filter:hue-rotate(120deg)}.gallery img:hover{filter:none}@media(max-width:600px){.gallery{grid-template-columns:1fr}}
</style>
</head><body><header><p>Responsive Css</p></header><h1>Filter Gallery</h1><main class="gallery"><figure><img class="filter1" src="https://picsum.photos/seed/filter1/480/320" alt="Filtered landscape 1"><figcaption>Filter 1</figcaption></figure><figure><img class="filter2" src="https://picsum.photos/seed/filter2/480/320" alt="Filtered landscape 2"><figcaption>Filter 2</figcaption></figure><figure><img class="filter3" src="https://picsum.photos/seed/filter3/480/320" alt="Filtered landscape 3"><figcaption>Filter 3</figcaption></figure><figure><img class="filter4" src="https://picsum.photos/seed/filter4/480/320" alt="Filtered landscape 4"><figcaption>Filter 4</figcaption></figure><figure><img class="filter5" src="https://picsum.photos/seed/filter5/480/320" alt="Filtered landscape 5"><figcaption>Filter 5</figcaption></figure><figure><img class="filter6" src="https://picsum.photos/seed/filter6/480/320" alt="Filtered landscape 6"><figcaption>Filter 6</figcaption></figure></main><footer>© 2026 Aditya Upadhyay</footer></body></html>
