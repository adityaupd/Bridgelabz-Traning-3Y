<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Responsive Cheat Sheet</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#172033;background:#f1f5f9}header,main,footer{max-width:1050px;margin:1rem auto}header,footer{padding:1rem;background:#0f172a;color:#fff}main{padding:1rem}h1{margin-top:0}section,article,.box,figure{padding:1rem;background:#fff;border-radius:.75rem}a{color:#075985}button,input,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:.4rem}button{cursor:pointer;background:#e0f2fe}img{max-width:100%;border-radius:.6rem}nav{display:flex;gap:1rem;flex-wrap:wrap}ul{padding-left:1.3rem}.sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.sheet article{transition:transform .2s,box-shadow .2s}.sheet article:hover{transform:translateY(-4px);box-shadow:0 8px 18px #0f172a20}code{overflow-wrap:anywhere}@media(max-width:700px){.sheet{grid-template-columns:1fr}}
</style>
</head><body><header><p>Responsive Css</p></header><h1>Responsive CSS Cheat Sheet</h1><main class="sheet"><article><h2>Filters</h2><code>filter: grayscale(1)</code></article><article><h2>Media queries</h2><code>@media (max-width: 700px)</code></article><article><h2>Responsive design</h2><p>Adapt layout to viewport and content.</p></article><article><h2>Typography</h2><code>font-size: clamp(1rem, 2vw, 1.5rem)</code></article></main><footer>© 2026 Aditya Upadhyay</footer></body></html>
