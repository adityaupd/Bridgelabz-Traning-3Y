<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Responsive Typography</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#172033;background:#f1f5f9}header,main,footer{max-width:1050px;margin:1rem auto}header,footer{padding:1rem;background:#0f172a;color:#fff}main{padding:1rem}h1{margin-top:0}section,article,.box,figure{padding:1rem;background:#fff;border-radius:.75rem}a{color:#075985}button,input,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:.4rem}button{cursor:pointer;background:#e0f2fe}img{max-width:100%;border-radius:.6rem}nav{display:flex;gap:1rem;flex-wrap:wrap}ul{padding-left:1.3rem}.type{max-width:60rem;margin:10vh auto;text-align:center;padding:2rem}.type h1{font-size:clamp(1.5rem,4vw,3rem)}.type p{font-size:clamp(1rem,2vw,1.5rem)}@media(max-width:700px){.type{padding:1rem;line-height:1.7}}
</style>
</head><body><header><p>Responsive Css</p></header><main class="type"><h1>Ideas that grow with the screen</h1><p>Fluid type keeps a page comfortable to read on phones, laptops, and larger displays. The clamp function sets a useful minimum, a viewport-based preferred size, and a maximum.</p></main><footer>© 2026 Aditya Upadhyay</footer></body></html>
