<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Responsive Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#172033;background:#f1f5f9}header,main,footer{max-width:1050px;margin:1rem auto}header,footer{padding:1rem;background:#0f172a;color:#fff}main{padding:1rem}h1{margin-top:0}section,article,.box,figure{padding:1rem;background:#fff;border-radius:.75rem}a{color:#075985}button,input,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:.4rem}button{cursor:pointer;background:#e0f2fe}img{max-width:100%;border-radius:.6rem}nav{display:flex;gap:1rem;flex-wrap:wrap}ul{padding-left:1.3rem}.dashboard{display:grid;grid-template-columns:14rem 1fr;gap:1rem}.dashboard aside{display:flex;flex-direction:column;gap:.8rem}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.cards article{min-height:8rem;animation:load .6s both;transition:transform .2s,box-shadow .2s}.cards article:hover{transform:scale(1.03);box-shadow:0 10px 20px #0f172a22}@keyframes load{from{opacity:0}to{opacity:1}}@media(max-width:750px){.dashboard,.cards{grid-template-columns:1fr}.dashboard aside{flex-direction:row;flex-wrap:wrap}}
</style>
