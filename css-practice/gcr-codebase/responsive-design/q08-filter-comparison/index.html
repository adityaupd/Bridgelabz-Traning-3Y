<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Filter Comparison</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#172033;background:#f1f5f9}header,main,footer{max-width:1050px;margin:1rem auto}header,footer{padding:1rem;background:#0f172a;color:#fff}main{padding:1rem}h1{margin-top:0}section,article,.box,figure{padding:1rem;background:#fff;border-radius:.75rem}a{color:#075985}button,input,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:.4rem}button{cursor:pointer;background:#e0f2fe}img{max-width:100%;border-radius:.6rem}nav{display:flex;gap:1rem;flex-wrap:wrap}ul{padding-left:1.3rem}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.comparison figure{margin:0}.comparison img{width:100%;transition:filter .4s}.filtered{filter:contrast(1.6) brightness(.8)}.filtered:hover{filter:none}@media(max-width:700px){.comparison{grid-template-columns:1fr}}
</style>
</head><body><header><p>Responsive Css</p></header><h1>Before and After</h1><main class="comparison"><figure><img src="https://picsum.photos/seed/compare/600/400" alt="Original mountain view"><figcaption>Original</figcaption></figure><figure><img class="filtered" src="https://picsum.photos/seed/compare/600/400" alt="Mountain view with adjusted contrast"><figcaption>Contrast filter - hover to remove</figcaption></figure></main><footer>© 2026 Aditya Upadhyay</footer></body></html>
