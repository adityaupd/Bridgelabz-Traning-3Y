<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loading</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a}main{display:flex;align-items:center;gap:1rem}main div{width:1rem;height:1rem;border-radius:50%;background:#38bdf8;animation:bounce .8s ease-in-out infinite alternate}main div:nth-child(2){animation-delay:.18s}main div:nth-child(3){animation-delay:.36s}@keyframes bounce{to{transform:translateY(-1.2rem);background:#a78bfa}}
</style>
</head><body><main aria-label="Loading"><div></div><div></div><div></div></main></body></html>
