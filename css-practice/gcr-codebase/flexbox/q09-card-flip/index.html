<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Card Flip</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;font:1rem/1.5 system-ui}.card{width:min(22rem,90vw);height:28rem;perspective:1000px}.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s}.card:hover .inner,.card:focus-within .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;border-radius:1rem;background:#f8fafc;text-align:center;backface-visibility:hidden}.front img{width:100%;border-radius:.7rem}.back{transform:rotateY(180deg);background:#dbeafe;color:#172554}
</style>
</head><body><main><article class="card"><div class="inner"><section class="face front"><img src="https://picsum.photos/seed/stargazer/500/300" alt="Night sky over mountains"><h1>Explore the night sky</h1></section><section class="face back"><h2>Look up</h2><p>Find a dark spot, let your eyes adjust, and watch for familiar constellations.</p></section></div></article></main></body></html>
