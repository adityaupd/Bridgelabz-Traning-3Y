<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mini UI Layout</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;font:1rem/1.6 system-ui,sans-serif;color:#172033;background:#f1f5f9}header,main,footer{max-width:1050px;margin:1rem auto}header,footer{padding:1rem;background:#0f172a;color:#fff}main{padding:1rem}h1{margin-top:0}section,article,.box,figure{padding:1rem;background:#fff;border-radius:.75rem}a{color:#075985}button,input,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:.4rem}button{cursor:pointer;background:#e0f2fe}img{max-width:100%;border-radius:.6rem}nav{display:flex;gap:1rem;flex-wrap:wrap}ul{padding-left:1.3rem}.mini{display:flex;align-items:center;gap:1.5rem;padding:1.5rem;border:1px solid #cbd5e1;box-shadow:0 8px 22px #0f172a1a}.mini img{width:45%;object-fit:cover}.mini form{display:grid;gap:.8rem}.mini input{display:block}.mini :focus{outline:3px solid #0ea5e9}.mini button:hover{background:#bfdbfe}@media(max-width:650px){.mini{flex-direction:column}.mini img{width:100%}}
</style>
</head><body><header><p>Css Ui Effects</p></header><header><h1>Campus Connect</h1></header><main class="mini"><img src="https://placehold.co/420x240?text=Campus+Life" alt="Campus community"><form><h2>Get campus updates</h2><label>Email <input type="email" placeholder="you@example.com" required></label><button>Subscribe</button></form></main><footer>© Campus Connect</footer><footer>© 2026 Aditya Upadhyay</footer></body></html>
