<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Travel Agency Carousel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.carousel-item img{height:clamp(260px,45vw,520px);object-fit:cover}.carousel-caption{background:#0008;border-radius:.5rem}
</style>
</head><body>
<!-- Bootstrap's container, row, columns, spacing, and component classes provide the responsive layout. -->
<main class="container py-5"><h1>Find your next trip</h1><div id="destinations" class="carousel slide" data-bs-ride="carousel"><div class="carousel-inner"><div class="carousel-item active" data-bs-interval="5000"><img src="https://picsum.photos/seed/travel1/1200/540" class="d-block w-100" alt="Destination: Kerala"><div class="carousel-caption"><h2>Kerala</h2><p>Backwaters and green hills</p></div></div><div class="carousel-item " data-bs-interval="5500"><img src="https://picsum.photos/seed/travel2/1200/540" class="d-block w-100" alt="Destination: Jaipur"><div class="carousel-caption"><h2>Jaipur</h2><p>Forts, markets, and craft</p></div></div><div class="carousel-item " data-bs-interval="6000"><img src="https://picsum.photos/seed/travel3/1200/540" class="d-block w-100" alt="Destination: Goa"><div class="carousel-caption"><h2>Goa</h2><p>Coastlines and local food</p></div></div></div><button class="carousel-control-prev" type="button" data-bs-target="#destinations" data-bs-slide="prev"><span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">Previous</span></button><button class="carousel-control-next" type="button" data-bs-target="#destinations" data-bs-slide="next"><span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">Next</span></button></div><section class="my-4"><h2 class="h5">Booking progress</h2><div class="progress" role="progressbar" aria-label="Booking completion" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%">70%</div></div></section></main><footer class="container text-center py-3">Contact: travel@example.com</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
