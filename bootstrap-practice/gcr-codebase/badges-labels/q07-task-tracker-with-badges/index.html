<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Task Tracker with Badges</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<!-- Bootstrap's container, row, columns, spacing, and component classes provide the responsive layout. -->
<main class="container py-5"><h1>Task tracker <span class="badge text-bg-primary">3 pending</span></h1><ul class="list-group my-4"><li class="list-group-item d-flex justify-content-between">Review responsive layout <span class="badge text-bg-danger">High</span></li><li class="list-group-item d-flex justify-content-between">Update project notes <span class="badge text-bg-warning">Medium</span></li><li class="list-group-item d-flex justify-content-between">Organize references <span class="badge text-bg-success">Low</span></li></ul><button class="btn btn-success">Completed <span class="badge text-bg-light">1</span></button></main>
</body></html>
