<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Three Step Form</title></head><body><h1>Registration</h1><form id="form"><section data-step="0"><label>Name <input name="name" required></label></section><section data-step="1" hidden><label>Email <input name="email" type="email" required></label></section><section data-step="2" hidden><label>Password <input name="password" type="password" minlength="8" required></label></section><button type="button" id="back">Back</button><button type="button" id="next">Next</button><button type="submit" id="finish" hidden>Finish</button></form><p id="summary"></p>
<script>
const form=document.querySelector("#form"),steps=[...form.querySelectorAll("section")],back=document.querySelector("#back"),next=document.querySelector("#next"),finish=document.querySelector("#finish");let current=0;function show(){steps.forEach((step,i)=>step.hidden=i!==current);back.disabled=current===0;next.hidden=current===2;finish.hidden=current!==2}back.onclick=()=>{if(current>0)current--;show()};next.onclick=()=>{const input=steps[current].querySelector("input");if(input.reportValidity()){current++;show()}};form.addEventListener("submit",e=>{e.preventDefault();if(form.reportValidity())document.querySelector("#summary").textContent=`Registration complete for ${form.elements.name.value} (${form.elements.email.value}).`});show();
</script>
</body></html>
