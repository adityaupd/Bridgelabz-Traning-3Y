<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Form Validation</title><style>.error{color:#b42318}</style></head><body><h1>Contact details</h1><form id="form" novalidate><label>Name <input name="name"></label><span data-error="name"></span><br><label>Email <input name="email" type="email"></label><span data-error="email"></span><br><label>Password <input name="password" type="password"></label><span data-error="password"></span><br><button>Submit</button></form><p id="success" aria-live="polite"></p>
<script>
const form=document.querySelector("#form"),rules={name:v=>v.trim()?"":"Name is required.",email:v=>v.includes("@")?"":"Enter an email containing @.",password:v=>v.length>=6?"":"Password must be at least 6 characters."};form.addEventListener("submit",e=>{e.preventDefault();let valid=true;for(const [name,check] of Object.entries(rules)){const error=check(form.elements[name].value),target=document.querySelector(`[data-error="${name}"]`);target.textContent=error;target.className=error?"error":"";if(error)valid=false}document.querySelector("#success").textContent=valid?"Form submitted successfully.":""});form.addEventListener("input",e=>{const check=rules[e.target.name];if(check){const error=check(e.target.value),target=document.querySelector(`[data-error="${e.target.name}"]`);target.textContent=error;target.className=error?"error":""}});
</script>
</body></html>
