<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Custom Dropdown</title><style>#menu{position:relative;width:14rem}#options{position:absolute;background:white;border:1px solid #888;list-style:none;padding:.3rem;margin:0;width:100%}[hidden]{display:none!important}#options button{width:100%;text-align:left}</style></head><body><h1>Course</h1><div id="menu"><button id="toggle" aria-expanded="false">Choose a course</button><ul id="options" hidden><li><button data-value="HTML">HTML</button></li><li><button data-value="CSS">CSS</button></li><li><button data-value="JavaScript">JavaScript</button></li></ul></div>
<script>
const menu=document.querySelector("#menu"),toggle=document.querySelector("#toggle"),options=document.querySelector("#options");function closeIfOutside(e){if(!menu.contains(e.target)){options.hidden=true;toggle.setAttribute("aria-expanded","false")}}document.addEventListener("click",closeIfOutside,true);toggle.addEventListener("click",()=>{options.hidden=!options.hidden;toggle.setAttribute("aria-expanded",String(!options.hidden))});options.addEventListener("click",e=>{if(e.target.dataset.value){toggle.textContent=e.target.dataset.value;options.hidden=true;toggle.setAttribute("aria-expanded","false")}});
</script>
</body></html>
