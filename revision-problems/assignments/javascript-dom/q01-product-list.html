<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product List Manager</title></head><body><h1>Products</h1><form id="add"><label>Product <input name="product" required></label><button>Add</button></form><ul id="products"></ul>
<script>
const list=document.querySelector("#products");document.querySelector("#add").addEventListener("submit",e=>{e.preventDefault();const item=document.createElement("li");item.innerHTML=`<span>${e.currentTarget.product.value.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}</span> <button data-action="edit">Edit</button> <button data-action="delete">Delete</button>`;list.append(item);e.currentTarget.reset()});list.addEventListener("click",e=>{const item=e.target.closest("li");if(!item)return;if(e.target.dataset.action==="delete")item.remove();if(e.target.dataset.action==="edit"){const span=item.querySelector("span"),input=document.createElement("input");input.value=span.textContent;span.replaceWith(input);input.focus();const save=()=>{const updated=document.createElement("span");updated.textContent=input.value;input.replaceWith(updated)};input.addEventListener("blur",save,{once:true});input.addEventListener("keydown",event=>{if(event.key==="Enter")input.blur()})}});
</script>
</body></html>
