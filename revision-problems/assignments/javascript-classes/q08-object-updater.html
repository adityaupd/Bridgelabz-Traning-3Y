<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>User Profile Editor</title></head><body><h1>Edit profile</h1><form id="edit"><label>Name <input name="name" value="John"></label><label>Email <input name="email" type="email" value="john@mail.com"></label><label>Age <input name="age" type="number" value="21"></label><button>Save</button></form><pre id="result"></pre>
<script>
const user={name:"John",email:"john@mail.com",age:21};const form=document.querySelector("#edit"),result=document.querySelector("#result");function render(){result.textContent=JSON.stringify(user,null,2)}render();form.addEventListener("submit",e=>{e.preventDefault();Object.assign(user,Object.fromEntries(new FormData(form)));user.age=Number(user.age);render()});
</script>
</body></html>
